<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabana do Geraldo</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Karla:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/tema.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top bg-hd border-bottom border-danger border-3">
  <div class="container-fluid flex-wrap gap-2 py-1">
    <button class="navbar-brand btn btn-link text-warning fs-4 text-decoration-none p-0" data-go="inicio"><img src="img/logo.png" alt="" class="brand-logo">🍁 Cabana do Geraldo</button>
    <div class="d-flex flex-wrap gap-1 flex-grow-1" id="nav"></div>
    <button class="btn btn-outline-warning rounded-circle" id="musicBtn" aria-pressed="false" title="Ligar/desligar música">🔇</button>
    <div class="d-flex align-items-center gap-2" id="who"></div>
  </div>
</nav>
<audio id="player" loop></audio>

<main id="app" class="container py-4"></main>

<div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartLabel">
  <div class="offcanvas-header border-bottom border-secondary-subtle">
    <h5 class="offcanvas-title" id="cartLabel">Carrinho</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body" id="cartBody"></div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-cabana text-light border border-warning">
      <form id="lf">
        <div class="modal-header border-secondary-subtle">
          <h5 class="modal-title">Entrar na cabana</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p id="lmsg" class="text-secondary small">Use seu nome de usuário e senha.</p>
          <div class="mb-3"><label for="un" class="form-label">Usuário</label><input id="un" class="form-control" autocomplete="username" required></div>
          <div class="mb-3"><label for="pw" class="form-label">Senha</label><input id="pw" type="password" class="form-control" autocomplete="current-password" required></div>
          <p class="text-danger small" id="lerr" role="alert"></p>
          <p class="text-secondary small mb-0">Para testar: <b>geraldo</b> / cabana123 (admin) ou <b>visitante</b> / orvalho123 (padrão).</p>
        </div>
        <div class="modal-footer border-secondary-subtle">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-warning fw-bold" type="submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="game-overlay" id="gameOverlay" hidden>
  <div class="game-shell">
    <div class="game-top">
      <b id="gameTitle">Jogo</b>
      <span id="gameStatus" class="small text-warning"></span>
      <button class="btn btn-sm btn-outline-light" id="gameClose" aria-label="Fechar jogo">✕</button>
    </div>
    <div class="game-stage">
      <canvas id="gameCanvas" width="960" height="540" tabindex="0"></canvas>
      <div class="game-end" id="gameEnd" hidden></div>
    </div>
    <div class="game-help" id="gameHelp"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/views.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
